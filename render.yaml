# Backend only (web/ deploys to Vercel).
# The live service (https://aster-jj5b.onrender.com) was created MANUALLY in the Render dashboard,
# not from this Blueprint, so edits here do not change it. This file mirrors its settings
# so the service can be recreated via New → Blueprint if needed.
# Python 3.12 is pinned by backend/.python-version. Dependencies come from backend/uv.lock
# (exported to requirements.txt at build time). sync:false values are prompted only on first
# Blueprint creation; add new keys in the dashboard later.
services:
  - type: web
    name: aster
    runtime: python
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: pip install uv && uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements.txt && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        sync: false
      - key: LOG_LEVEL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GATEWAY_TOKEN
        sync: false
      - key: GPU_WORKER_NAME
        sync: false
      - key: GPU_STALE_SECONDS
        sync: false
      - key: GPU_URL_OVERRIDE
        sync: false
      - key: BRAIN_MODEL
        sync: false
      - key: FALLBACK_LLM_BASE_URL
        sync: false
      - key: FALLBACK_LLM_API_KEY
        sync: false
      - key: FALLBACK_LLM_MODEL
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_STT_MODEL
        sync: false
      - key: SARVAM_TTS_MODEL
        sync: false
      - key: SARVAM_TTS_VOICE_MR
        sync: false
      - key: SARVAM_TTS_VOICE_HI
        sync: false
      - key: SARVAM_TTS_VOICE_EN
        sync: false
      - key: BHASHINI_USER_ID
        sync: false
      - key: BHASHINI_ULCA_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
